<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayVibe Games Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .view-section { display: none !important; }
    .view-section.active { display: block !important; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans flex flex-col justify-between">

  <!-- TOP HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-2 cursor-pointer" onclick="showView('view-home')">
      <i class="fa-solid fa-gamepad text-purple-500 text-2xl"></i>
      <span class="font-bold text-lg tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">PlayVibe</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="openLanguageSelection()" class="bg-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-1 border border-slate-600">
        <i class="fa-solid fa-globe text-cyan-400"></i>
        <span id="current-lang-code">EN</span>
      </button>
      <div class="bg-purple-900/50 border border-purple-500/40 px-3 py-1 rounded-full flex items-center space-x-2">
        <i class="fa-solid fa-coins text-yellow-400 text-sm"></i>
        <span id="header-points" class="font-bold text-sm text-yellow-300">200</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="p-4 max-w-md mx-auto w-full flex-1">
    <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 w-full max-w-xs pointer-events-none flex flex-col items-center"></div>

    <!-- 1. HOME VIEW -->
    <section id="view-home" class="view-section active space-y-4">
      <div class="bg-gradient-to-r from-purple-900 to-slate-800 border border-purple-700/50 rounded-2xl p-4 flex justify-between items-center shadow-xl">
        <div>
          <h3 class="font-bold text-sm text-purple-200">Daily Attendance</h3>
          <p class="text-xs text-slate-400">Claim daily bonus points!</p>
        </div>
        <button onclick="claimDailyAttendance()" class="bg-gradient-to-r from-purple-500 to-pink-500 font-bold text-xs px-4 py-2 rounded-xl active:scale-95 transition">
          Claim +50
        </button>
      </div>

      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Select a Game</h2>
      
      <div class="grid grid-cols-2 gap-3">
        <!-- Ludo Card -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex flex-col items-center justify-between space-y-3 text-center">
          <div class="w-12 h-12 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center text-2xl">
            <i class="fa-solid fa-dice"></i>
          </div>
          <div>
            <h4 class="font-bold text-sm">Ludo King</h4>
            <p class="text-[10px] text-slate-400">Entry: 50 Pts</p>
          </div>
          <button onclick="startLudoGame(50)" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold text-xs py-2 rounded-xl active:scale-95 transition">
            Play Ludo
          </button>
        </div>

        <!-- Quiz Card -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex flex-col items-center justify-between space-y-3 text-center">
          <div class="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center text-2xl">
            <i class="fa-solid fa-brain"></i>
          </div>
          <div>
            <h4 class="font-bold text-sm">Quiz Challenge</h4>
            <p class="text-[10px] text-slate-400">Win up to 100 Pts</p>
          </div>
          <button onclick="showCategoryModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-2 rounded-xl active:scale-95 transition">
            Start Quiz
          </button>
        </div>
      </div>
    </section>

    <!-- 2. LUDO GAME VIEW -->
    <section id="view-ludo" class="view-section space-y-4">
      <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
        <button onclick="showView('view-home')" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">
          <i class="fa-solid fa-arrow-left mr-1"></i> Exit
        </button>
        <span class="font-bold text-sm text-red-400">Ludo Arena</span>
        <span class="text-xs bg-purple-900/60 text-purple-300 px-2.5 py-1 rounded-full border border-purple-500/30">Player 1 Turn</span>
      </div>

      <div class="bg-slate-800 border border-slate-700 p-2 rounded-2xl flex justify-center items-center">
        <canvas id="ludo-canvas" width="300" height="300" class="bg-slate-900 rounded-xl border border-slate-700 max-w-full"></canvas>
      </div>

      <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex justify-around items-center">
        <div class="text-center">
          <p class="text-[10px] text-slate-400">Dice Result</p>
          <div id="dice-value" class="text-3xl font-black text-yellow-400 mt-1">🎲</div>
        </div>
        <button onclick="rollLudoDice()" class="bg-gradient-to-r from-red-500 to-pink-600 font-bold px-6 py-3 rounded-xl text-sm active:scale-95 transition">
          Roll Dice
        </button>
      </div>
    </section>

    <!-- 3. QUIZ VIEW -->
    <section id="view-quiz" class="view-section space-y-4">
      <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
        <button onclick="showView('view-home')" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">
          <i class="fa-solid fa-arrow-left mr-1"></i> Exit
        </button>
        <span id="quiz-category-badge" class="text-xs font-bold text-blue-400 uppercase">QUIZ</span>
      </div>

      <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl space-y-4">
        <p id="question-text" class="font-bold text-sm text-slate-200">Loading Question...</p>
        <div id="options-container" class="space-y-2"></div>
      </div>
    </section>

    <!-- RESULT VIEW -->
    <section id="view-result" class="view-section text-center space-y-4">
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-3">
        <h2 class="text-xl font-black text-purple-400">Game Over!</h2>
        <p id="final-score-display" class="text-3xl font-black text-yellow-400">+0 Pts</p>
        <button onclick="showView('view-home')" class="bg-purple-600 font-bold px-6 py-2.5 rounded-xl text-xs mt-2">
          Back to Home
        </button>
      </div>
    </section>
  </main>

  <!-- CATEGORY MODAL -->
  <div id="category-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-xs space-y-4">
      <h3 class="font-bold text-sm text-center">Choose Quiz Topic</h3>
      <div class="space-y-2">
        <button onclick="startCategoryQuiz('cricket')" class="w-full bg-slate-700 p-3 rounded-xl text-xs text-left">🏏 Cricket Quiz</button>
        <button onclick="startCategoryQuiz('gk')" class="w-full bg-slate-700 p-3 rounded-xl text-xs text-left">🌐 General Knowledge</button>
      </div>
      <button onclick="closeCategoryModal()" class="w-full text-xs text-slate-400 pt-2">Cancel</button>
    </div>
  </div>
    <script>
    let userPoints = 200;
    let currentQIndex = 0;
    let quizScore = 0;

    const questionBank = {
      cricket: [
        { q: "How many players in a cricket team?", options: ["9", "10", "11", "12"], answer: 2 },
        { q: "IPL match duration in overs?", options: ["20", "50", "10", "40"], answer: 0 }
      ],
      gk: [
        { q: "Capital of India?", options: ["Mumbai", "New Delhi", "Kolkata", "Chennai"], answer: 1 }
      ]
    };

    function showView(viewId) {
      document.querySelectorAll('.view-section').forEach(sec => {
        sec.classList.remove('active');
      });
      const target = document.getElementById(viewId);
      if (target) {
        target.classList.add('active');
      }
    }

    function updateHeaderStats() {
      document.getElementById('header-points').innerText = userPoints;
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = "bg-slate-800 text-white text-xs px-4 py-2 rounded-full border border-slate-700 shadow-xl mb-2";
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function claimDailyAttendance() {
      userPoints += 50;
      updateHeaderStats();
      showToast("🎉 Claimed +50 Bonus Points!");
    }

    function startLudoGame(entryFee = 50) {
      if (userPoints < entryFee) {
        showToast("⚠️ Insufficient points! Need " + entryFee + " points.");
        return;
      }
      showView('view-ludo');
      userPoints -= entryFee;
      updateHeaderStats();
      drawLudoBoard();
      showToast(`🎮 Ludo Started! -${entryFee} Pts`);
    }

    function drawLudoBoard() {
      const canvas = document.getElementById('ludo-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 300, 300);

      // Red Home
      ctx.fillStyle = '#ef4444'; ctx.fillRect(0, 0, 120, 120);
      // Green Home
      ctx.fillStyle = '#10b981'; ctx.fillRect(180, 0, 120, 120);
      // Yellow Home
      ctx.fillStyle = '#eab308'; ctx.fillRect(180, 180, 120, 120);
      // Blue Home
      ctx.fillStyle = '#3b82f6'; ctx.fillRect(0, 180, 120, 120);
      // Center
      ctx.fillStyle = '#64748b'; ctx.fillRect(120, 120, 60, 60);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('LUDO BOARD', 112, 155);
    }

    function rollLudoDice() {
      const diceVal = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-value').innerText = diceVal;
      showToast(`🎲 You rolled a ${diceVal}!`);
    }

    function showCategoryModal() { document.getElementById('category-modal').classList.remove('hidden'); }
    function closeCategoryModal() { document.getElementById('category-modal').classList.add('hidden'); }

    function startCategoryQuiz(catKey) {
      closeCategoryModal();
      activeQuizQuestions = questionBank[catKey] || questionBank['cricket'];
      currentQIndex = 0; quizScore = 0;
      document.getElementById('quiz-category-badge').innerText = catKey.toUpperCase();
      showView('view-quiz');
      loadQuizQuestion();
    }

    function loadQuizQuestion() {
      if (currentQIndex >= activeQuizQuestions.length) {
        userPoints += quizScore;
        updateHeaderStats();
        document.getElementById('final-score-display').innerText = `+${quizScore} Pts`;
        showView('view-result');
        return;
      }
      const q = activeQuizQuestions[currentQIndex];
      document.getElementById('question-text').innerText = q.q;
      const optsBox = document.getElementById('options-container');
      optsBox.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left bg-slate-700 text-white text-xs p-3 rounded-xl border border-slate-600 flex justify-between";
        btn.innerHTML = `<span>${opt}</span><i class="fa-regular fa-circle text-slate-400"></i>`;
        btn.onclick = () => {
          if (idx === q.answer) quizScore += 20;
          currentQIndex++; loadQuizQuestion();
        };
        optsBox.appendChild(btn);
      });
    }

    updateHeaderStats();
  </script>
</body>
</html>
