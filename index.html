<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayVibe — Daily Social Challenges</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 font-sans">
    <!-- Header -->
    <header class="sticky top-0 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <span class="text-xl">⚡</span>
            <span class="font-bold text-lg bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">PlayVibe</span>
        </div>
        <div id="auth-section" class="flex items-center gap-2">
            <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-full transition">Google Sign-In</button>
            <div id="user-profile" class="hidden flex items-center gap-2">
                <div class="flex items-center gap-1 bg-slate-800/80 px-2 py-1 rounded-full border border-slate-700 text-xs">
                    <span class="text-yellow-400 font-bold">🏆</span>
                    <span id="user-points" class="font-bold text-slate-200">0</span>
                </div>
                <img id="user-avatar" class="w-7 h-7 rounded-full border border-indigo-400" src="" alt="Profile">
                <span id="user-name" class="text-xs font-bold text-slate-200 hidden sm:inline"></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Daily Streak Card -->
        <div class="bg-gradient-to-r from-orange-950/40 to-slate-900 border border-orange-500/20 rounded-2xl p-4 flex justify-between items-center">
            <div>
                <p class="text-orange-400 font-bold text-xs">DAILY STREAK</p>
                <h2 class="text-lg font-bold mt-0.5"><span id="streak-count">0</span> Days Active</h2>
                <p class="text-xs text-slate-400 mt-1" id="streak-msg">Aaj ka challenge complete karke streak banao!</p>
            </div>
            <button id="checkin-btn" onclick="handleCheckIn()" class="bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs transition">Check-In</button>
        </div>

        <!-- Featured Challenge -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center text-xs">
                <span class="bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full font-bold border border-indigo-500/30">TODAY'S CHALLENGE</span>
                <span class="text-slate-400">+100 Points</span>
            </div>
            <div>
                <h3 class="font-bold text-base">Speed Quiz Arena</h3>
                <p class="text-xs text-slate-400 mt-1">60 seconds mein trending questions ke fast answers do.</p>
            </div>
            <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30">Play Challenge</button>
        </div>
    </main>

    <!-- Quiz Modal / Screen -->
    <div id="quiz-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl relative">
            <!-- Modal Header -->
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-1 rounded-lg border border-indigo-500/30 font-bold" id="q-number">Question 1/3</span>
                </div>
                <div class="flex items-center gap-1.5 bg-red-500/10 text-red-400 px-3 py-1 rounded-full border border-red-500/20 font-bold text-xs">
                    <span>⏱️</span>
                    <span id="timer">60s</span>
                </div>
            </div>

            <!-- Quiz Question Box -->
            <div id="quiz-box" class="space-y-4">
                <h3 id="question-text" class="text-base font-bold text-slate-100 min-h-[50px] flex items-center">Loading Question...</h3>
                <div id="options-container" class="space-y-2">
                    <!-- Options injected dynamically -->
                </div>
            </div>

            <!-- Quiz Result Box (Hidden by default) -->
            <div id="result-box" class="hidden text-center py-6 space-y-4">
                <div class="text-5xl">🎉</div>
                <h3 class="text-xl font-bold text-slate-100">Quiz Completed!</h3>
                <p class="text-sm text-slate-400">Aapne score kiya: <span id="final-score" class="text-indigo-400 font-bold text-lg">0</span> Points</p>
                <button onclick="closeQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl text-sm transition">Collect Points & Exit</button>
            </div>
        </div>
    </div>

    <!-- Firebase Logic Script -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAY-q5jpMCMUkCF_TM3YQ_6wKtyfvDySDk",
            authDomain: "playvibe-71ed3.firebaseapp.com",
            projectId: "playvibe-71ed3",
            storageBucket: "playvibe-71ed3.firebasestorage.app",
            messagingSenderId: "154300720449",
            appId: "1:154300720449:web:cb6feeda486f71e15eadc0"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userTotalPoints = 0;

        // Quiz Questions Data
        const questions = [
            { q: "HTML ka full form kya hai?", options: ["Hyper Text Markup Language", "High Text Machine Language", "Hyperlink Text Mode Language"], answer: 0 },
            { q: "World Wide Web (WWW) kisne invent kiya tha?", options: ["Bill Gates", "Tim Berners-Lee", "Steve Jobs"], answer: 1 },
            { q: "India ka Silicon Valley kis city ko kaha jata hai?", options: ["Mumbai", "Delhi", "Bengaluru"], answer: 2 }
        ];

        let currentQIndex = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;

        // Google Sign-In Function (Popup)
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                alert("Login Error: " + error.message);
            });
        }

        // Auth State Change Listener
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('user-avatar').src = user.photoURL;
                document.getElementById('user-name').innerText = user.displayName ? user.displayName.split(' ')[0] : 'User';
                
                loadUserData(user.uid);
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-profile').classList.add('hidden');
                document.getElementById('streak-count').innerText = '0';
                document.getElementById('user-points').innerText = '0';
            }
        });

        // Load User Data from Firestore
        async function loadUserData(uid) {
            try {
                const userRef = db.collection('users').doc(uid);
                const doc = await userRef.get();
                
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('streak-count').innerText = data.streak || 0;
                    userTotalPoints = data.points || 0;
                    document.getElementById('user-points').innerText = userTotalPoints;
                    
                    const today = new Date().toISOString().split('T')[0];
                    if (data.lastCheckIn === today) {
                        disableCheckInButton("Done Today!");
                    }
                } else {
                    await userRef.set({
                        name: currentUser.displayName,
                        email: currentUser.email,
                        streak: 0,
                        points: 0,
                        lastCheckIn: ""
                    });
                }
            } catch (e) {
                console.error("Error loading user data:", e);
            }
        }

        // Handle Daily Check-In
        async function handleCheckIn() {
            if (!currentUser) {
                alert("Check-In karne ke liye pehle Google Sign-In karein!");
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const userRef = db.collection('users').doc(currentUser.uid);

            try {
                const doc = await userRef.get();
                let currentStreak = 0;
                let lastCheckIn = "";

                if (doc.exists) {
                    currentStreak = doc.data().streak || 0;
                    lastCheckIn = doc.data().lastCheckIn || "";
                }

                if (lastCheckIn === today) {
                    alert("Aapne aaj ka Check-In kar liya hai!");
                    disableCheckInButton("Done Today!");
                    return;
                }

                const newStreak = currentStreak + 1;
                await userRef.set({
                    streak: newStreak,
                    lastCheckIn: today,
                    name: currentUser.displayName,
                    email: currentUser.email
                }, { merge: true });

                document.getElementById('streak-count').innerText = newStreak;
                disableCheckInButton("Done Today!");
                alert("🎉 Daily Streak Updated! Total Days: " + newStreak);
            } catch (e) {
                alert("Check-In Error: " + e.message);
            }
        }

        function disableCheckInButton(text) {
            const btn = document.getElementById('checkin-btn');
            btn.innerText = text;
            btn.disabled = true;
            btn.classList.remove('bg-orange-500', 'hover:bg-orange-400');
            btn.classList.add('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
        }

        // Quiz Logic
        function startQuiz() {
            if (!currentUser) {
                alert("Quiz khelne ke liye pehle Google Sign-In karein!");
                return;
            }

            currentQIndex = 0;
            score = 0;
            timeLeft = 60;

            document.getElementById('quiz-box').classList.remove('hidden');
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('quiz-modal').classList.remove('hidden');

            renderQuestion();
            startTimer();
        }

        function renderQuestion() {
            if (currentQIndex >= questions.length) {
                endQuiz();
                return;
            }

            const q = questions[currentQIndex];
            document.getElementById('q-number').innerText = `Question ${currentQIndex + 1}/${questions.length}`;
            document.getElementById('question-text').innerText = q.q;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-800 hover:bg-slate-700 text-xs font-semibold py-3 px-4 rounded-xl border border-slate-700/60 transition";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx);
                optsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx) {
            if (selectedIdx === questions[currentQIndex].answer) {
                score += 50; // 50 points per right answer
            }
            currentQIndex++;
            renderQuestion();
        }

        function startTimer() {
            document.getElementById('timer').innerText = `${timeLeft}s`;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    endQuiz();
                }
            }, 1000);
        }

        async function endQuiz() {
            clearInterval(timerInterval);
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;

            // Save new total points in Firestore
            if (score > 0 && currentUser) {
                userTotalPoints += score;
                const userRef = db.collection('users').doc(currentUser.uid);
                await userRef.set({
                    points: userTotalPoints
                }, { merge: true });

                document.getElementById('user-points').innerText = userTotalPoints;
            }
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
