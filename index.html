<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayVibe — Daily Social Challenges</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 font-sans">
    <!-- Header -->
    <header class="sticky top-0 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <span class="text-xl">⚡</span>
            <span class="font-bold text-lg bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">PlayVibe</span>
        </div>
        <div id="auth-section" class="flex items-center gap-2">
            <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-full transition">Google Sign-In</button>
            <div id="user-profile" class="hidden flex items-center gap-2">
                <img id="user-avatar" class="w-7 h-7 rounded-full border border-indigo-400" src="" alt="Profile">
                <span id="user-name" class="text-xs font-bold text-slate-200"></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Daily Streak Card -->
        <div class="bg-gradient-to-r from-orange-950/40 to-slate-900 border border-orange-500/20 rounded-2xl p-4 flex justify-between items-center">
            <div>
                <p class="text-orange-400 font-bold text-xs">DAILY STREAK</p>
                <h2 class="text-lg font-bold mt-0.5"><span id="streak-count">0</span> Days Active</h2>
                <p class="text-xs text-slate-400 mt-1" id="streak-msg">Aaj ka challenge complete karke streak banao!</p>
            </div>
            <button id="checkin-btn" onclick="handleCheckIn()" class="bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs transition">Check-In</button>
        </div>

        <!-- Featured Challenge -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center text-xs">
                <span class="bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full font-bold border border-indigo-500/30">TODAY'S CHALLENGE</span>
                <span class="text-slate-400">+100 Points</span>
            </div>
            <div>
                <h3 class="font-bold text-base">Speed Quiz Arena</h3>
                <p class="text-xs text-slate-400 mt-1">60 seconds mein trending viral questions ke answer do.</p>
            </div>
            <button class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl text-sm transition">Play Challenge</button>
        </div>
    </main>

    <!-- Firebase Logic Script -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAY-q5jpMCMUkCF_TM3YQ_6wKtyfvDySDk",
            authDomain: "playvibe-71ed3.firebaseapp.com",
            projectId: "playvibe-71ed3",
            storageBucket: "playvibe-71ed3.firebasestorage.app",
            messagingSenderId: "154300720449",
            appId: "1:154300720449:web:cb6feeda486f71e15eadc0"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // Google Sign-In Function (Popup)
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                alert("Login Error: " + error.message);
            });
        }

        // Auth State Change Listener
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('user-avatar').src = user.photoURL;
                document.getElementById('user-name').innerText = user.displayName ? user.displayName.split(' ')[0] : 'User';
                
                // Load user streak from Firestore
                loadUserData(user.uid);
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-profile').classList.add('hidden');
                document.getElementById('streak-count').innerText = '0';
            }
        });

        // Load User Data from Firestore
        async function loadUserData(uid) {
            try {
                const userRef = db.collection('users').doc(uid);
                const doc = await userRef.get();
                
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('streak-count').innerText = data.streak || 0;
                    
                    const today = new Date().toISOString().split('T')[0];
                    if (data.lastCheckIn === today) {
                        disableCheckInButton("Done Today!");
                    }
                } else {
                    // Initialize User Profile in Database
                    await userRef.set({
                        name: currentUser.displayName,
                        email: currentUser.email,
                        streak: 0,
                        lastCheckIn: ""
                    });
                }
            } catch (e) {
                console.error("Error loading user data:", e);
            }
        }

        // Handle Daily Check-In
        async function handleCheckIn() {
            if (!currentUser) {
                alert("Check-In karne ke liye pehle Google Sign-In karein!");
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const userRef = db.collection('users').doc(currentUser.uid);

            try {
                const doc = await userRef.get();
                let currentStreak = 0;
                let lastCheckIn = "";

                if (doc.exists) {
                    currentStreak = doc.data().streak || 0;
                    lastCheckIn = doc.data().lastCheckIn || "";
                }

                if (lastCheckIn === today) {
                    alert("Aapne aaj ka Check-In kar liya hai!");
                    disableCheckInButton("Done Today!");
                    return;
                }

                const newStreak = currentStreak + 1;
                await userRef.set({
                    streak: newStreak,
                    lastCheckIn: today,
                    name: currentUser.displayName,
                    email: currentUser.email
                }, { merge: true });

                document.getElementById('streak-count').innerText = newStreak;
                disableCheckInButton("Done Today!");
                alert("🎉 Daily Streak Updated! Total Days: " + newStreak);
            } catch (e) {
                alert("Check-In Error: " + e.message);
            }
        }

        function disableCheckInButton(text) {
            const btn = document.getElementById('checkin-btn');
            btn.innerText = text;
            btn.disabled = true;
            btn.classList.remove('bg-orange-500', 'hover:bg-orange-400');
            btn.classList.add('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
