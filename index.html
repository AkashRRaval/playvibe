<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayVibe — Daily Social Challenges</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 font-sans">
    <!-- Header -->
    <header class="sticky top-0 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <span class="text-xl">⚡</span>
            <span class="font-bold text-lg bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">PlayVibe</span>
        </div>
        <div class="flex gap-2 text-xs font-semibold">
            <span class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-orange-400 flex items-center gap-1">🔥 0</span>
            <span class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-yellow-400 flex items-center gap-1">⭐ 0</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Daily Streak Card -->
        <div class="bg-gradient-to-r from-orange-950/40 to-slate-900 border border-orange-500/20 rounded-2xl p-4 flex justify-between items-center">
            <div>
                <p class="text-orange-400 font-bold text-xs">DAILY STREAK</p>
                <h2 class="text-lg font-bold mt-0.5">0 Days Active</h2>
                <p class="text-xs text-slate-400 mt-1">Aaj ka challenge complete karke streak banao!</p>
            </div>
            <button class="bg-orange-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs">Check-In</button>
        </div>

        <!-- Featured Challenge -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center text-xs">
                <span class="bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full font-bold border border-indigo-500/30">TODAY'S CHALLENGE</span>
                <span class="text-slate-400">+100 Points</span>
            </div>
            <div>
                <h3 class="font-bold text-base">Speed Quiz Arena</h3>
                <p class="text-xs text-slate-400 mt-1">60 seconds mein trending viral questions ke answer do.</p>
            </div>
            <button class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl text-sm transition">Play Challenge</button>
        </div>

        <!-- Share Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center">
            <div>
                <h4 class="font-bold text-sm">Challenge Friends</h4>
                <p class="text-xs text-slate-400">Apna score share karke doston ko harao!</p>
            </div>
            <button class="bg-slate-800 border border-slate-700 text-xs font-bold px-3 py-2 rounded-xl">Share Link</button>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 py-2 px-6 flex justify-around text-xs text-slate-400">
        <button class="text-indigo-400 font-bold">Home</button>
        <button>Games</button>
        <button>Leaderboard</button>
        <button>Profile</button>
    </nav>
</body>
</html>
